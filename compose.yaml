services:
  emdash:
    build: .
    ports:
      - "4321:4321"
    volumes:
      - /data/emdash:/app/data
      - /data/emdash-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:4321/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s